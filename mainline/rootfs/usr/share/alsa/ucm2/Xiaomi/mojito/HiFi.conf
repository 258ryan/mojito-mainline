# Xiaomi Redmi Note 10 (mojito): WCD9375 codec over SoundWire + two Awinic AW87xxx amplifiers.
#
#   Speaker:    RX0 -> RX INT0 -> HPHL_OUT -> RDAC3 -> EAR -> "EAR Amp" (i2c 0x5b)
#               RX1 -> RX INT2 -> AUX                  -> "AUX Amp" (i2c 0x58)
#               Verified on hardware: left = earpiece (top, 0x5b), right = main speaker (bottom, 0x58).
#               The EAR path runs through the HPH-left stage, so it needs the HPH settings below.
#               The main speaker needs class AB (RX HPH Mode) and kernel pkgrel >= 27.
#   Headphones: RX0 -> RX INT0 -> HPHL, RX1 -> RX INT1 -> HPHR
#   Mic:        AMIC1 -> ADC1 -> TX DEC0 -> TX_CODEC_DMA_TX_3 -> MultiMedia2
#
# Hardware digital gain is capped at -12 dB (72 of 84) to protect the small speaker; PipeWire's
# software volume works below that.

SectionVerb {
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='HPHL_COMP Switch' 0"
		cset "name='HPHR_COMP Switch' 0"
		cset "name='HPHL Volume' 10"
		cset "name='HPHR Volume' 10"
		cset "name='RX_RX0 Digital Volume' 72"
		cset "name='RX_RX1 Digital Volume' 72"
		cset "name='RX_RX2 Digital Volume' 72"
		cset "name='AUX Amp PA Switch' 0"
		cset "name='EAR Amp PA Switch' 0"

		# capture route (DAPM selections only; the mic powers up with a capture stream)
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 12"
	]

	DisableSequence [
		cset "name='AUX Amp PA Switch' 0"
		cset "name='EAR Amp PA Switch' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		# Class AB, as stock does for the AUX output (needs kernel pkgrel >= 29: older drivers
		# had shifted item names and "CLS_AB" selected another mode).
		cset "name='RX HPH Mode' CLS_AB"
		cset "name='RX INT2_1 MIX1 INP0' RX1"
		cset "name='RDAC3_MUX' RX1"
		cset "name='HPHL Switch' 1"
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='EAR_RDAC Switch' 1"
		cset "name='AUX_RDAC Switch' 1"
		cset "name='LO Switch' 1"
		cset "name='CLSH PA Switch' 1"
		cset "name='EAR Amp PA Switch' 1"
		cset "name='AUX Amp PA Switch' 1"
	]

	DisableSequence [
		cset "name='EAR Amp PA Switch' 0"
		cset "name='AUX Amp PA Switch' 0"
		cset "name='EAR_RDAC Switch' 0"
		cset "name='AUX_RDAC Switch' 0"
		cset "name='LO Switch' 0"
		cset "name='RX INT2_1 MIX1 INP0' ZERO"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='HPHL_RDAC Switch' 1"
		cset "name='HPHR_RDAC Switch' 1"
		cset "name='HPHL Switch' 1"
		cset "name='HPHR Switch' 1"
		cset "name='CLSH PA Switch' 1"
	]

	DisableSequence [
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='HPHR Switch' 0"
		cset "name='RX INT1_1 MIX1 INP0' ZERO"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}
